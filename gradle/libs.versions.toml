# Plead for Android: every dependency the port needs (docs/android-port/PORT.md §2).
# Shared file: add entries, never rename or remove one another wave uses.
[versions]
agp = "8.13.2"
kotlin = "2.2.20"
googleServices = "4.4.3"

coreKtx = "1.16.0"
activityCompose = "1.10.1"
composeBom = "2025.06.01"
navigationCompose = "2.9.3"
lifecycle = "2.9.2"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
supabase = "3.2.6"
ktor = "3.2.3"
revenuecat = "10.19.1"
firebaseBom = "33.16.0"
glance = "1.1.1"
datastore = "1.1.7"
coil = "3.3.0"
credentials = "1.5.0"
googleid = "1.1.1"
